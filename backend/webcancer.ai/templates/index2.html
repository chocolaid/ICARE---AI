<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Cancer Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        .upload-form {
            text-align: center;
            margin-bottom: 20px;
        }
        .upload-form h1 {
            font-size: 28px;
            color: #444;
        }
        .upload-form p {
            margin-top: 10px;
        }
        .upload-form input[type=file] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f8f8f8;
        }
        .upload-form input[type=submit] {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background-color: #4445ea;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .prediction {
            text-align: center;
            margin-top: 20px;
        }
        .prediction h2 {
            font-size: 24px;
            color: #444;
        }
        .prediction p {
            font-size: 16px;
            color: #666;
        }
        .prediction img {
            max-width: 100%;
            margin-top: 20px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="{{ url_for('static', filename='icare.png') }}" width="10%" alt="Logo">
        </div>
        <div class="upload-form">
            <h1>Skin Cancer Classifier</h1>
            <form method="POST" enctype="multipart/form-data">
                {{ form.hidden_tag() }}
                <p><input type="file" name="image"></p>
                <p><input type="submit" value="Upload Image"></p>
            </form>
        </div>

        {% if class_ind is not none %}
        <div class="prediction">
            <h2>Prediction: {{ classes[class_ind] }}</h2>
            <p>{{ classes[class_ind] }}</p>
            <img src="{{ url_for('static', filename=pic_name) }}" alt="Uploaded Image">
        </div>
        {% endif %}
    </div>
</body>
</html>
